<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Descubra Passos</title>
  <meta name="description" content="Mapa 3D interativo dos pontos turísticos, trilhas, hotéis e restaurantes de Passos (MG) e região.">
  <meta name="theme-color" content="#1F6E74">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2215%22 fill=%22%231F6E74%22/%3E%3Cpath d=%22M5 22l7-9 5 6 3-4 7 7%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%222.5%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap">
  <link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="caderno" id="caderno" aria-label="Lugares">
    <button class="alca" id="alca" aria-label="Expandir ou recolher a lista"></button>

    <header class="marca">
      <svg class="marca-simbolo" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M2 30c6-1 9-9 14-9s7 5 11 5 7-6 11-7" />
        <path d="M2 23c6-1 8-12 14-12s8 8 12 8 7-5 10-6" />
        <path d="M6 15c4-1 6-10 11-10s7 6 10 6" />
      </svg>
      <div>
        <h1>Descubra Passos</h1>
        <p>Lugares, trilhas e mesas do Sudoeste de Minas</p>
      </div>
    </header>

    <div class="busca">
      <label class="campo-busca">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
        <input id="busca" type="search" placeholder="Buscar por nome, cachoeira, pizza…" aria-label="Buscar lugar" autocomplete="off">
      </label>
      <nav class="filtros" aria-label="Filtrar por categoria">
        <button class="chip ativo" data-cat="todos" aria-pressed="true">Todos</button>
        <button class="chip" data-cat="turismo" aria-pressed="false">Passeios</button>
        <button class="chip" data-cat="trilha" aria-pressed="false">Trilhas</button>
        <button class="chip" data-cat="hotel" aria-pressed="false">Hospedagem</button>
        <button class="chip" data-cat="restaurante" aria-pressed="false">Onde comer</button>
      </nav>
    </div>

    <ul id="lista" class="lista" aria-label="Resultados"></ul>
    <p id="vazio" class="vazio-lista" hidden>Nenhum lugar com esse nome. Tente outra palavra ou volte para “Todos”.</p>

    <article id="painel" class="painel" aria-live="polite" hidden>
      <button class="voltar" id="painel-fechar">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
        Todos os lugares
      </button>
      <div id="painel-conteudo"></div>
    </article>
  </aside>

  <main>
    <div id="mapa" aria-label="Mapa de Passos e região"></div>

    <div class="controles-vista" role="group" aria-label="Visualização do mapa">
      <div class="alternador">
        <button id="btn-mapa" class="ativo" aria-pressed="true">Mapa</button>
        <button id="btn-satelite" aria-pressed="false">Satélite</button>
      </div>
      <button id="btn-visao-geral" class="botao-flutuante" title="Voltar à visão da cidade">Ver a cidade</button>
    </div>

    <div id="aviso-mapa" class="aviso-mapa" role="status" hidden></div>

    <section id="realista" class="realista" aria-label="Visualização 3D realista" hidden>
      <div id="realista-cena"></div>
      <div class="realista-barra">
        <strong id="realista-titulo"></strong>
        <button id="realista-sobrevoo" class="btn" hidden>Sobrevoar a trilha</button>
        <button id="realista-fechar" class="btn secundario">Voltar ao mapa</button>
      </div>
      <div id="realista-status" class="realista-status" hidden></div>
    </section>
  </main>

  <!-- Fora do <main>: ele é position: fixed e prenderia o visor abaixo da coluna lateral -->
  <div id="visor" class="visor" role="dialog" aria-modal="true" aria-label="Foto ampliada" hidden>
    <button class="visor-fechar" aria-label="Fechar foto">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="visor-anterior" aria-label="Foto anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <img alt="">
    <button class="visor-proxima" aria-label="Próxima foto">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <p class="visor-legenda"></p>
  </div>

  <script src="vendor/maplibre-gl/maplibre-gl.js"></script>
  <script src="js/config.js"></script>
  <script src="data/locais.js"></script>
  <script src="js/realista.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
